# Render Blueprint — API NFS-e (nfse-nacional)
# Segredos (Neon, admin key) NÃO ficam aqui — preencher no dashboard (sync:false).
services:
  - type: web
    name: nfse-nacional
    runtime: docker
    rootDir: nfse-nacional
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false        # jdbc:postgresql://<host-neon>/neondb?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false        # neondb_owner
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false        # senha do Neon
      - key: NFSE_ADMIN_KEY
        sync: false        # segredo forte (NÃO usar admin_dev_key)
      - key: NFSE_CERT_SENHA
        value: sandbox
